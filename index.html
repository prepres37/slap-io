<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Царь горы</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #020004; font-family: Arial, sans-serif; touch-action: none; }
        #ui {
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%); z-index: 10;
            display: flex; gap: 20px; background: rgba(23, 20, 38, 0.9); padding: 10px 20px;
            border-radius: 30px; border: 2px solid #ff007f; box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
            font-size: 16px; font-weight: bold; white-space: nowrap; color: #fff;
        }
        canvas { display: block; width: 100vw; height: 100vh; }
        #shop-btn {
            position: fixed; bottom: 20px; right: 20px; z-index: 10; background: #ff007f; border: none;
            color: white; padding: 12px 20px; border-radius: 20px; font-weight: bold; cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 0, 127, 0.4);
        }
        #shop-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 20; background: #171426; border: 3px solid #00ffcc; border-radius: 20px;
            padding: 20px; width: 90%; max-width: 320px; text-align: center; color: #fff;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.4);
        }
        .skin-option {
            background: #25213b; border: 2px solid #4a2574; border-radius: 10px; padding: 10px;
            margin: 10px 0; display: flex; justify-content: space-between; align-items: center; gap: 10px;
        }
        .skin-btn { background: #00ffcc; border: none; color: #000; padding: 5px 10px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .skin-btn.equipped { background: #ff007f; color: #fff; }
        #close-shop { margin-top: 15px; background: #555; border: none; color: white; padding: 8px 15px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="ui">
        <div>Враги: <span id="enemiesCount">0</span> 👾</div>
        <div>Монеты: <span id="coins">0</span> 💰</div>
    </div>

    <button id="shop-btn">🏪 Магазин Скинов</button>

    <div id="shop-modal">
        <h3 style="margin-bottom: 10px;">Выбери мем-скин</h3>
        <div id="skins-list"></div>
        <button id="close-shop">Закрыть</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const enemiesUI = document.getElementById("enemiesCount");
        const coinsUI = document.getElementById("coins");
        const shopBtn = document.getElementById("shop-btn");
        const shopModal = document.getElementById("shop-modal");
        const closeShop = document.getElementById("close-shop");
        const skinsList = document.getElementById("skins-list");

        const arena = { x: 600, y: 600, radius: 400 };

        let coins = Number(localStorage.getItem("shove_coins")) || 0;
        coinsUI.textContent = coins;

        let targetX = arena.x;
        let targetY = arena.y;
        let isPointerDown = false;

        let particles = [];
        let rings = [];
        let floaters = [];
        let shake = 0;
        let time = 0;

        // ===== АУДИО =====
        let audioCtx = null;
        let lastFallSoundTime = 0;

        function initAudio() {
            if (audioCtx) {
                if (audioCtx.state === "suspended") audioCtx.resume();
                return;
            }
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {}
        }

        function playFallSound() {
            const now = performance.now();
            if (now - lastFallSoundTime < 350) return;
            lastFallSoundTime = now;

            // Падающий свист
            if (audioCtx) {
                const t = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(1500, t);
                osc.frequency.exponentialRampToValueAtTime(90, t + 1.3);
                gain.gain.setValueAtTime(0.10, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 1.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + 1.4);
            }

            // Писклявый мышиный "аааааааа"
            if ("speechSynthesis" in window) {
                try {
                    const u = new SpeechSynthesisUtterance("аааааааа");
                    u.pitch = 2;
                    u.rate = 1.6;
                    u.volume = 0.35;
                    u.lang = "ru-RU";
                    speechSynthesis.speak(u);
                } catch (e) {}
            }
        }

        const skins = [
            { id: "default", name: "🟢 Огурец", color: "#00ffcc", price: 0, emoji: "🟢" },
            { id: "capybara", name: "🦫 Капибара", color: "#b5895a", price: 50, emoji: "🦫" },
            { id: "floppa", name: "🐈 Шлёпа", color: "#ffaa44", price: 120, emoji: "🐈" },
            { id: "anon", name: "🎭 Анонимус", color: "#ffffff", price: 250, emoji: "🎭" }
        ];

        let ownedSkins = ["default"];
        try { ownedSkins = JSON.parse(localStorage.getItem("shove_owned_skins")) || ["default"]; }
        catch (e) { ownedSkins = ["default"]; }

        let currentSkin = localStorage.getItem("shove_current_skin") || "default";

        class Entity {
            constructor(x, y, radius, skinId, isPlayer = false) {
                this.x = x; this.y = y; this.radius = radius;
                this.isPlayer = isPlayer; this.skinId = skinId;
                this.vx = 0; this.vy = 0; this.mass = radius; this.alive = true;
                this.hitCooldown = 0;
            }

            update() {
                if (!this.alive) return;
                if (this.hitCooldown > 0) this.hitCooldown--;

                if (this.isPlayer) {
                    if (isPointerDown) {
                        const dx = targetX - this.x;
                        const dy = targetY - this.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist > 5) {
                            const speed = Math.min(dist * 0.08, 5);
                            this.vx += (dx / dist) * speed * 0.2;
                            this.vy += (dy / dist) * speed * 0.2;
                        }
                    }
                } else {
                    if (player && player.alive) {
                        const dx = player.x - this.x;
                        const dy = player.y - this.y;
                        const dist = Math.hypot(dx, dy) || 1;
                        if (dist < 300) {
                            this.vx += (dx / dist) * 0.15;
                            this.vy += (dy / dist) * 0.15;
                        } else if (Math.random() < 0.02) {
                            this.vx += (Math.random() - 0.5) * 2;
                            this.vy += (Math.random() - 0.5) * 2;
                        }
                    }
                }

                this.vx *= 0.95;
                this.vy *= 0.95;
                this.x += this.vx;
                this.y += this.vy;

                const distToCenter = Math.hypot(this.x - arena.x, this.y - arena.y);
                if (distToCenter > arena.radius) {
                    this.alive = false;

                    if (!this.isPlayer) {
                        spawnBurst(this.x, this.y, "#ff3366", 22, 7);
                        spawnRing(this.x, this.y, "#ff3366", 55);
                        spawnFloater(this.x, this.y, "+10 💰", "#ffd54f");
                        coins += 10;
                        localStorage.setItem("shove_coins", coins);
                        coinsUI.textContent = coins;
                        updateShopUI();
                        if (player && Math.hypot(this.x - player.x, this.y - player.y) < 220) shake = Math.max(shake, 6);
                        playFallSound();
                    } else {
                        spawnBurst(this.x, this.y, "#00ffcc", 45, 10);
                        spawnRing(this.x, this.y, "#00ffcc", 90);
                        spawnFloater(this.x, this.y, "ААААААА!", "#ff3366");
                        shake = 18;
                        playFallSound();
                        setTimeout(() => resetGame(), 1200);
                    }
                }
            }

            draw(camX, camY) {
                if (!this.alive) return;
                const skin = skins.find(s => s.id === this.skinId) || skins[0];

                ctx.save();
                ctx.translate(this.x - camX, this.y - camY);

                if (this.isPlayer) {
                    const pulse = 1 + Math.sin(time * 0.15) * 0.12;

                    ctx.beginPath();
                    ctx.arc(0, 0, (this.radius + 12) * pulse, 0, Math.PI * 2);
                    ctx.strokeStyle = "rgba(255, 213, 79, 0.9)";
                    ctx.lineWidth = 3;
                    ctx.shadowColor = "#ffd54f";
                    ctx.shadowBlur = 15;
                    ctx.stroke();
                    ctx.shadowBlur = 0;

                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius + 18, time * 0.05, time * 0.05 + Math.PI * 1.4);
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = skin.color;
                ctx.fill();
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.closePath();

                ctx.fillStyle = "#000";
                ctx.font = `${this.radius * 1.1}px Arial`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(skin.emoji, 0, 0);

                ctx.restore();
            }
        }

        let player;
        let entities = [];

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        function resetGame() {
            player = new Entity(arena.x, arena.y, 24, currentSkin, true);
            entities = [player];

            const enemySkins = ["capybara", "floppa", "anon", "default"];
            for (let i = 0; i < 5; i++) {
                const randomSkin = enemySkins[Math.floor(Math.random() * enemySkins.length)];
                const angle = Math.random() * Math.PI * 2;
                const r = 50 + Math.random() * (arena.radius - 120);
                entities.push(new Entity(arena.x + Math.cos(angle) * r, arena.y + Math.sin(angle) * r, 22, randomSkin));
            }

            particles = [];
            rings = [];
            floaters = [];
            shake = 0;
        }

        function spawnBurst(x, y, color, count = 18, power = 6) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * power;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                    life: 1, decay: 0.02 + Math.random() * 0.03,
                    size: 2 + Math.random() * 4, color
                });
            }
        }

        function spawnRing(x, y, color = "#ff007f", maxR = 45) {
            rings.push({ x, y, r: 6, maxR, life: 1, decay: 0.06, color });
        }

        function spawnFloater(x, y, text, color = "#ffd54f") {
            floaters.push({ x, y, text, color, life: 1, decay: 0.015, vy: -0.9 });
        }

        function updateAndDrawEffects(camX, camY) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.vx *= 0.96; p.vy *= 0.96;
                p.life -= p.decay;
                if (p.life <= 0) { particles.splice(i, 1); continue; }
                ctx.save();
                ctx.globalAlpha = Math.max(p.life, 0);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x - camX, p.y - camY, Math.max(p.size * p.life, 0.5), 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            for (let i = rings.length - 1; i >= 0; i--) {
                const r = rings[i];
                r.r += (r.maxR - r.r) * 0.15;
                r.life -= r.decay;
                if (r.life <= 0) { rings.splice(i, 1); continue; }
                ctx.save();
                ctx.globalAlpha = Math.max(r.life, 0);
                ctx.strokeStyle = r.color;
                ctx.lineWidth = 3 * r.life;
                ctx.beginPath();
                ctx.arc(r.x - camX, r.y - camY, r.r, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }

            for (let i = floaters.length - 1; i >= 0; i--) {
                const f = floaters[i];
                f.y += f.vy;
                f.life -= f.decay;
                if (f.life <= 0) { floaters.splice(i, 1); continue; }
                ctx.save();
                ctx.globalAlpha = Math.max(f.life, 0);
                ctx.font = "bold 18px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.lineWidth = 4;
                ctx.strokeStyle = "#000";
                ctx.strokeText(f.text, f.x - camX, f.y - camY);
                ctx.fillStyle = f.color;
                ctx.fillText(f.text, f.x - camX, f.y - camY);
                ctx.restore();
            }
        }

        // ===== ФОН: ГОРА И ПРОПАСТЬ =====
        function drawMountain(camX, camY) {
            const cx = arena.x - camX;
            const cy = arena.y - camY;

            // 1. Глубокая пропасть
            const abyss = ctx.createRadialGradient(cx, cy, arena.radius * 0.8, cx, cy, Math.max(canvas.width, canvas.height) * 0.9);
            abyss.addColorStop(0, "#100820");
            abyss.addColorStop(0.4, "#080312");
            abyss.addColorStop(1, "#010005");
            ctx.fillStyle = abyss;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Туман в пропасти
            for (let i = 0; i < 7; i++) {
                const angle = (i / 7) * Math.PI * 2 + time * 0.0006;
                const dist = arena.radius + 160 + i * 40;
                const mx = cx + Math.cos(angle) * dist;
                const my = cy + Math.sin(angle) * dist;
                const mg = ctx.createRadialGradient(mx, my, 0, mx, my, 110);
                mg.addColorStop(0, "rgba(90, 50, 120, 0.18)");
                mg.addColorStop(1, "rgba(90, 50, 120, 0)");
                ctx.fillStyle = mg;
                ctx.beginPath();
                ctx.arc(mx, my, 110, 0, Math.PI * 2);
                ctx.fill();
            }

            // 3. Тень обрыва (глубина)
            const cliffOuter = arena.radius + 90;
            const shadow = ctx.createRadialGradient(cx, cy, cliffOuter - 40, cx, cy, cliffOuter + 50);
            shadow.addColorStop(0, "rgba(0,0,0,0)");
            shadow.addColorStop(0.5, "rgba(0,0,0,0.75)");
            shadow.addColorStop(1, "rgba(0,0,0,0)");
            ctx.fillStyle = shadow;
            ctx.beginPath();
            ctx.arc(cx, cy, cliffOuter + 50, 0, Math.PI * 2);
            ctx.fill();

            // 4. Скальный массив вокруг арены
            const cliffGrad = ctx.createRadialGradient(cx, cy, arena.radius, cx, cy, cliffOuter);
            cliffGrad.addColorStop(0, "#4a4458");
            cliffGrad.addColorStop(0.4, "#353042");
            cliffGrad.addColorStop(0.8, "#221f2e");
            cliffGrad.addColorStop(1, "#100e16");
            ctx.fillStyle = cliffGrad;
            ctx.beginPath();
            ctx.arc(cx, cy, cliffOuter, 0, Math.PI * 2);
            ctx.fill();

            // 5. Трещины и камни
            ctx.strokeStyle = "rgba(10, 8, 15, 0.7)";
            for (let i = 0; i < 40; i++) {
                const angle = i * 0.157 + Math.sin(i * 13.7) * 0.5;
                const r1 = arena.radius + 3;
                const r2 = arena.radius + 30 + Math.abs(Math.sin(i * 5.3)) * 50;
                ctx.lineWidth = 1 + (i % 2);
                ctx.beginPath();
                ctx.moveTo(cx + Math.cos(angle) * r1, cy + Math.sin(angle) * r1);
                ctx.lineTo(cx + Math.cos(angle + 0.15) * r2, cy + Math.sin(angle + 0.15) * r2);
                ctx.stroke();
            }

            ctx.fillStyle = "rgba(110, 100, 130, 0.28)";
            for (let i = 0; i < 16; i++) {
                const angle = i * 0.42 + Math.sin(i * 7.1) * 0.8;
                const r = arena.radius + 15 + Math.abs(Math.sin(i * 3.3)) * 55;
                ctx.beginPath();
                ctx.arc(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r, 4 + (i % 4) * 3, 0, Math.PI * 2);
                ctx.fill();
            }

            // 6. Тень у края арены (площадка приподнята)
            ctx.beginPath();
            ctx.arc(cx, cy, arena.radius + 10, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0,0,0,0.65)";
            ctx.fill();

            // 7. Платформа арены
            const arenaGrad = ctx.createRadialGradient(cx - arena.radius * 0.2, cy - arena.radius * 0.2, 0, cx, cy, arena.radius);
            arenaGrad.addColorStop(0, "#3a3650");
            arenaGrad.addColorStop(0.7, "#252236");
            arenaGrad.addColorStop(1, "#181524");
            ctx.fillStyle = arenaGrad;
            ctx.beginPath();
            ctx.arc(cx, cy, arena.radius, 0, Math.PI * 2);
            ctx.fill();

            // 8. Круги-плиты на арене
            ctx.strokeStyle = "rgba(70, 65, 90, 0.4)";
            ctx.lineWidth = 1;
            for (let r = 50; r < arena.radius; r += 70) {
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.stroke();
            }

            // 9. Радиальные трещины
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2 + 0.3;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + Math.cos(angle) * arena.radius * 0.9, cy + Math.sin(angle) * arena.radius * 0.9);
                ctx.strokeStyle = "rgba(40, 35, 60, 0.5)";
                ctx.stroke();
            }

            // 10. Опасный край (неоновая подсветка)
            ctx.beginPath();
            ctx.arc(cx, cy, arena.radius, 0, Math.PI * 2);
            ctx.strokeStyle = "#ff007f";
            ctx.lineWidth = 6;
            ctx.shadowColor = "#ff007f";
            ctx.shadowBlur = 22;
            ctx.stroke();
            ctx.shadowBlur = 0;

            // 11. Внутренняя пунктирная линия предупреждения
            ctx.beginPath();
            ctx.arc(cx, cy, arena.radius - 12, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(255, 0, 127, 0.4)";
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 12]);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function handleCollisions() {
            for (let i = 0; i < entities.length; i++) {
                for (let j = i + 1; j < entities.length; j++) {
                    const e1 = entities[i], e2 = entities[j];
                    if (!e1.alive || !e2.alive) continue;

                    let dx = e2.x - e1.x, dy = e2.y - e1.y;
                    let dist = Math.hypot(dx, dy);
                    if (dist === 0) { dx = 0.01; dy = 0; dist = 0.01; }

                    const minDist = e1.radius + e2.radius;
                    if (dist < minDist) {
                        const overlap = minDist - dist;
                        const nx = dx / dist, ny = dy / dist;

                        e1.x -= nx * overlap * 0.5; e1.y -= ny * overlap * 0.5;
                        e2.x += nx * overlap * 0.5; e2.y += ny * overlap * 0.5;

                        const kx = e1.vx - e2.vx, ky = e1.vy - e2.vy;
                        const p = 2 * (nx * kx + ny * ky) / (e1.mass + e2.mass);
                        const impact = Math.abs(p);

                        e1.vx -= p * e2.mass * nx * 2.0; e1.vy -= p * e2.mass * ny * 2.0;
                        e2.vx += p * e1.mass * nx * 2.0; e2.vy += p * e1.mass * ny * 2.0;

                        const midX = (e1.x + e2.x) / 2, midY = (e1.y + e2.y) / 2;
                        const isPlayerInvolved = e1.isPlayer || e2.isPlayer;

                        if (impact > 0.25) {
                            const sparkCount = Math.min(Math.floor(impact * 8) + 2, 36);
                            const sparkPower = Math.min(impact * 2.2 + 1, 14);

                            let sparkColor;
                            if (impact > 3) sparkColor = "#ffd54f";
                            else if (impact > 1.5) sparkColor = "#ff007f";
                            else sparkColor = "#ffffff";

                            spawnBurst(midX, midY, sparkColor, sparkCount, sparkPower);

                            if (impact > 1.0) spawnRing(midX, midY, sparkColor, 20 + impact * 12);
                            if (isPlayerInvolved) shake = Math.max(shake, Math.min(impact * 2.5, 14));
                        }

                        if (isPlayerInvolved && impact > 1.8) {
                            const attacker = e1.isPlayer ? e1 : e2;
                            if (attacker.hitCooldown <= 0) {
                                const bonus = Math.floor(impact * 1.5);
                                coins += bonus;
                                localStorage.setItem("shove_coins", coins);
                                coinsUI.textContent = coins;
                                spawnFloater(midX, midY - 10, "+" + bonus + " 💰", "#ffd54f");
                                updateShopUI();
                                attacker.hitCooldown = 25;
                            }
                        }
                    }
                }
            }
        }

        function setInput(clientX, clientY) {
            if (!player) return;
            const camX = player.x - canvas.width / 2;
            const camY = player.y - canvas.height / 2;
            targetX = clientX + camX;
            targetY = clientY + camY;
        }

        window.addEventListener("pointerdown", (e) => {
            initAudio();
            if (e.target.closest("button")) return;
            isPointerDown = true;
            setInput(e.clientX, e.clientY);
        });
        window.addEventListener("pointermove", (e) => { if (isPointerDown) setInput(e.clientX, e.clientY); });
        window.addEventListener("pointerup", () => { isPointerDown = false; });
        window.addEventListener("pointercancel", () => { isPointerDown = false; });

        function updateShopUI() {
            skinsList.innerHTML = "";
            skins.forEach((skin) => {
                const div = document.createElement("div");
                div.className = "skin-option";
                const span = document.createElement("span");
                span.textContent = skin.name;
                const btn = document.createElement("button");
                const isOwned = ownedSkins.includes(skin.id);
                const isEquipped = currentSkin === skin.id;
                btn.className = "skin-btn" + (isEquipped ? " equipped" : "");
                btn.textContent = isEquipped ? "Надет" : (isOwned ? "Надеть" : skin.price + " 💰");

                btn.onclick = () => {
                    if (isOwned) {
                        currentSkin = skin.id;
                        localStorage.setItem("shove_current_skin", currentSkin);
                        if (player) player.skinId = currentSkin;
                        updateShopUI();
                        return;
                    }
                    if (coins >= skin.price) {
                        coins -= skin.price;
                        localStorage.setItem("shove_coins", coins);
                        coinsUI.textContent = coins;
                        ownedSkins.push(skin.id);
                        localStorage.setItem("shove_owned_skins", JSON.stringify(ownedSkins));
                        currentSkin = skin.id;
                        localStorage.setItem("shove_current_skin", currentSkin);
                        if (player) player.skinId = currentSkin;
                        updateShopUI();
                    }
                };

                div.appendChild(span);
                div.appendChild(btn);
                skinsList.appendChild(div);
            });
        }

        shopBtn.onclick = () => { shopModal.style.display = "block"; updateShopUI(); };
        closeShop.onclick = () => { shopModal.style.display = "none"; };

        function gameLoop() {
            time++;
            ctx.fillStyle = "#020004";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (player) {
                let camX = player.x - canvas.width / 2;
                let camY = player.y - canvas.height / 2;

                if (shake > 0.3) {
                    camX += (Math.random() - 0.5) * shake;
                    camY += (Math.random() - 0.5) * shake;
                    shake *= 0.9;
                } else shake = 0;

                // Гора + пропасть
                drawMountain(camX, camY);

                let aliveEnemies = 0;
                entities.forEach((e) => {
                    e.update();
                    e.draw(camX, camY);
                    if (!e.isPlayer && e.alive) aliveEnemies++;
                });

                handleCollisions();
                updateAndDrawEffects(camX, camY);
                enemiesUI.textContent = aliveEnemies;

                if (aliveEnemies === 0 && player.alive) {
                    spawnBurst(arena.x, arena.y, "#00ffcc", 60, 12);
                    spawnRing(arena.x, arena.y, "#00ffcc", 120);
                    spawnFloater(arena.x, arena.y - 60, "ЦАРЬ ГОРЫ!", "#00ffcc");
                    shake = 12;
                    setTimeout(() => { alert("Победа! Ты — Царь горы!"); resetGame(); }, 150);
                }
            }

            requestAnimationFrame(gameLoop);
        }

        resetGame();
        gameLoop();
    </script>
</body>
</html>
